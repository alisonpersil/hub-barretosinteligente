name: Rebuild Monitor Exati Dashboard

on:
  push:
    paths:
      - '01 - Relatórios/02 - Monitor Exati/Base de dados/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy openpyxl xlrd

      - name: Rebuild Dashboard Data
        run: |
          python "01 - Relatórios/02 - Monitor Exati/build_dashboard_data.py"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "01 - Relatórios/02 - Monitor Exati/dashboard_data.json" "01 - Relatórios/02 - Monitor Exati/historico_backlog.json" || true
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos indicadores do dashboard."
          else
            git commit -m "auto(exati): recalcular dashboard_data.json com novas planilhas [skip ci]"
            git push origin main
          fi
